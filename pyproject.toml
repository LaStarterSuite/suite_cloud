[project]
name = "suite_cloud"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io" },
]
description = "Deploys and manages Stalwart mail clusters for Frappe Suite sites: clusters, nodes, DNS, egress gateways and a per-site directory API."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
dependencies = [
    "dnspython~=2.6.1",  # DNS Record verification, hostname lookups
    "dns-lexicon[route53]~=3.20.1",  # DNS provider API; route53 extra pulls boto3
    "ansible-runner~=2.4.1",  # Server Job playbooks over SSH
    # The Ansible that ansible-runner drives, with community.general (ufw). Held at the 12 line
    # (ansible-core 2.19): 2.20 and later refuse nodes with Python 3.8, which is Ubuntu 20.04's.
    "ansible~=12.3",
    "cryptography>=42",  # ed25519 SSH keypairs for clusters
    "PyYAML>=6",  # reading playbooks to pre-create task rows
    "opentelemetry-proto~=1.45",  # decoding Stalwart's OTLP metrics push
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"
insights = ">=4.0.0-dev,<5.0.0"

# Installed from Ubuntu repositories when the app is hosted on Frappe Cloud
[deploy.dependencies.apt]
packages = [
    "openssh-client",  # ssh and ssh-keyscan, which Ansible and Verify SSH call
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
